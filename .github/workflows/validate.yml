name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Run HACS / Marketplace Validation
        uses: hacs/action@main
        with:
          category: integration
